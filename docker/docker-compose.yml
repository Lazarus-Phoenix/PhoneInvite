version: '3.8'

services:
  db:
    image: postgres 13
    environment:
      POSTGRES_DB: referral_db
      POSTGRES_USER: skypro
      POSTGRES_PASSWORD: skypro
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://skypro:skypro@db:5432/referral_db
volumes:
  postgres_data:


