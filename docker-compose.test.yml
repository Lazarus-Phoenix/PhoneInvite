version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoneinvite_app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/phoneinvite_test
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
      - TESTING=True
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "python src/manage.py migrate &&
             python src/manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=phoneinvite_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data_test:/var/lib/postgresql/data/

  redis:
    image: redis:6
    volumes:
      - redis_data_test:/data

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/phoneinvite_test
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
      - TESTING=True
    depends_on:
      - db
      - redis
    command: celery -A src worker --loglevel=info

volumes:
  postgres_data_test:
  redis_data_test: